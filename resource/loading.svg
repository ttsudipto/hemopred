<svg width="300" height="300" viewBox="0 0 350 350" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="liquid" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="60%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </radialGradient>

    <radialGradient id="highlight" cx="35%" cy="25%">
      <stop offset="0%" stop-color="white" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <path id="orbitPath"
          d="M100,40
             a60,60 0 1,1 0,120
             a60,60 0 1,1 0,-120" />
  </defs>

  <!-- ORBIT -->
  <g>
    <circle cx="100" cy="100" r="60"
            fill="none"
            stroke="#ff4d4d"
            stroke-width="1.2"
            opacity="0.25"
            stroke-dasharray="4 6"
            filter="url(#glow)">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 100 100"
                        to="360 100 100"
                        dur="2s"
                        repeatCount="indefinite"/>
    </circle>

    <circle r="4" fill="#000000" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite">
        <mpath href="#orbitPath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- DROPLET (NO PULSING) -->
  <g transform="translate(100 100) scale(0.75) translate(-100 -100)">

    <path d="
      M100,38
      C82,70 60,95 60,120
      C60,155 82,170 100,170
      C118,170 140,155 140,120
      C140,95 118,70 100,38
      Z"
      fill="url(#liquid)"
      filter="url(#glow)"/>

    <ellipse cx="85" cy="105" rx="16" ry="26"
             fill="url(#highlight)"
             opacity="0.4"/>

  </g>

  <!-- TEXT -->
  <text x="100" y="190"
        text-anchor="middle"
        font-size="28"
        font-weight="700"
        fill="#000000"
        font-family="Arial, sans-serif"
        opacity="0.95">
    Loading ...
  </text>

</svg>
